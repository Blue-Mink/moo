name: Moo Mate Release

# ── 为什么这里只「校验」不构建 ────────────────────────────────────────
# 1) Mate 无自更新机制，release 资产仅供手动下载；产物由发布机构建并人工验收，
#    其 sha256 已写进 moo.json（以及 FnDepot 索引）。CI 若再重建并 --clobber
#    覆盖，资产字节就变了，索引里的 sha256 立刻对不上。
# 2) 官方 fnpack 下载 URL（https://static2.fnnas.com/fnpack/fnpack）间歇 404
#    （2026-10-28 实测 404），CI 无法可靠组包。
# 因此流水线职责改为：tag 推上来后核对 release 资产与 moo.json 索引是否一致
# （架构齐全 + size/sha256 逐字相符 + .sha256 侧车在场）。构建仍在发布机执行
# （`bash build-mate.sh x86|arm`），签名/校验同机完成。
on:
  push:
    tags:
      - 'mate-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要校验的 release tag（留空则取当前 ref 名，例如 mate-v0.2.31）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # ── 质量门：脱敏 + vet + test（cmd/moo-mate/gate.sh，失败即停）──────────
  gate:
    name: Gate (sanitize/vet/test)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run gate (sanitize/vet/test)
        run: bash cmd/moo-mate/gate.sh

  # ── 校验 release 资产 == moo.json 索引 ────────────────────────────────
  verify-release:
    name: Verify release assets
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve tag
        id: t
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          case "$TAG" in
            mate-v*) ;;
            *) echo "::error::tag 必须形如 mate-vX.Y.Z，实际：$TAG"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#mate-v}" >> "$GITHUB_OUTPUT"
          echo "校验目标：$TAG（版本 ${TAG#mate-v}）"

      - name: Verify assets against moo.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.t.outputs.tag }}
          VER: ${{ steps.t.outputs.ver }}
        run: python3 .github/scripts/verify_mate_release.py
