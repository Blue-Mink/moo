name: Skills Check

# 技能目录自检：结构 / 链接 / manifest 哈希 / 安装器 dry-run / 测试 / 脱敏
on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "tools/**"
      - "docs/Moo应用源协议.md"
      - ".github/workflows/skills-check.yml"
  pull_request:
    paths:
      - "skills/**"
      - "tools/**"
      - "docs/Moo应用源协议.md"
      - ".github/workflows/skills-check.yml"

permissions:
  contents: read

concurrency:
  group: skills-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Skills self-check
        run: python3 skills/ci_check.py
