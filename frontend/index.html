    <!-- 状态栏/导航栏配色跟随主题（飞牛 app WebView 读 theme-color） -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <title>Moo</title>
    <!-- 主题预水合：next-themes 在 Vite SPA 里没有首帧脚本，不加这段每次加载
         都会先亮色后暗色闪一下（用户反馈"模式切换不丝滑"的主因）。
         在首次绘制前按 localStorage（key=theme，next-themes 约定）/系统偏好
         直接挂 .dark 类，消除加载闪变。 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark =
            t === 'dark' ||
            (t !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) { /* ignore */ }
      })();
    </script>
    <!-- 首帧 splash：零额外请求（内联 SVG + 内联 CSS）。
         JS 下载前 WebView（尤其 FN Connect 公网：高延迟隧道 + 数百 KB bundle）
         立即绘出正确底色 + 呼吸 logo，消除白屏/空白首帧；
         React 首帧渲染后由 main.tsx 淡出移除。 -->
    <style>
      html { background: #f5f5f7; }
      html.dark { background: #000; }
      #moo-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #f5f5f7; pointer-events: none;
        transition: opacity .3s ease;
      }
      html.dark #moo-splash { background: #000; }
      #moo-splash svg { width: 84px; height: 84px; animation: moo-pulse 1.5s ease-in-out infinite; }
      #moo-splash span {
        font: 600 18px/1 -apple-system, "SF Pro Display", "Helvetica Neue", "PingFang SC", sans-serif;
        letter-spacing: .06em; color: #86868b;
      }
      html.dark #moo-splash span { color: #98989e; }
      @keyframes moo-pulse {
        0%, 100% { opacity: .45; transform: scale(.97); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
